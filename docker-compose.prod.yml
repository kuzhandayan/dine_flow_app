name: dineflow-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dineflow-prod
    ports:
      - "3000:3000"
    # Inject secrets at runtime — NOT baked into the image
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
